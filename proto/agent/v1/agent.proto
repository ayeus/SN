syntax = "proto3";

package ayeusann.agent.v1;

option go_package = "github.com/ayeus/ayeusann/gen/go/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

// ─── Agent ↔ Coordinator Service ─────────────────────────────
//
// The agent always dials out; hosts never accept inbound connections. Every
// control message AND every inference request travels over this one stream,
// which is what lets a laptop behind home NAT or a lab behind campus NAT serve
// traffic without port-forwarding (ADR-001, ADR-011).

service AgentService {
  // Bidirectional stream for persistent agent sessions.
  // Agent sends Register first, then Heartbeat, BenchmarkReport, StageEvent,
  // InferenceChunk. Coordinator sends ManifestDispatch, StopReplica,
  // InferenceRequest, InferenceCancel, DrainRequest.
  rpc Session(stream AgentMessage) returns (stream CoordinatorMessage);
}

// ─── Agent → Coordinator Messages ────────────────────────────

message AgentMessage {
  oneof payload {
    RegisterRequest register = 1;
    Heartbeat heartbeat = 2;
    BenchmarkReport benchmark = 3;
    StageEvent stage_event = 4;
    UsageBatch usage_batch = 5;
    DrainAck drain_ack = 6;
    InferenceChunk inference_chunk = 7;
  }
}

message RegisterRequest {
  // Exactly one of registration_token (first enrolment) or host_credential
  // (every reconnect after that) must be set. Registration tokens are single
  // use; the credential returned in RegisterResponse is what keeps a host
  // enrolled across restarts.
  string registration_token = 1;
  string hostname = 2;
  string os = 3;
  string os_version = 4;
  string kernel = 5;
  string region = 6;
  repeated GpuInfo gpus = 7;
  string agent_version = 8;
  string hardware_fingerprint = 9;
  string wg_public_key = 10;
  string host_credential = 11;
  // Local serving runtime the agent drives: "ollama" or "vllm".
  string runtime = 12;
  // Model identifiers already present in the runtime's local cache.
  repeated string cached_models = 13;
}

message GpuInfo {
  string model = 1;
  int32 vram_gb = 2;
  string driver_version = 3;
  string cuda_version = 4;
  int32 compute_capability_major = 5;
  int32 compute_capability_minor = 6;
  string uuid = 7;
  string fingerprint = 8;
}

message Heartbeat {
  google.protobuf.Timestamp ts = 1;
  double cpu_usage_pct = 2;
  double memory_usage_pct = 3;
  repeated GpuStatus gpu_status = 4;
  int32 active_jobs = 5;
  bool host_user_active = 6;  // For pause-when-active
  repeated string cached_models = 7;
  bool runtime_healthy = 8;
}

message GpuStatus {
  string gpu_uuid = 1;
  double utilization_pct = 2;
  int32 vram_used_mb = 3;
  int32 vram_total_mb = 4;
  int32 temperature_c = 5;
  int32 power_draw_w = 6;
}

message BenchmarkReport {
  string hardware_fingerprint = 1;
  repeated GpuBenchmark gpu_benchmarks = 2;
  double disk_read_mbps = 3;
  double disk_write_mbps = 4;
  double net_upload_mbps = 5;
  double net_download_mbps = 6;
  double latency_to_pop_ms = 7;
  google.protobuf.Timestamp ran_at = 8;
}

message GpuBenchmark {
  string gpu_uuid = 1;
  double compute_score = 2;
  double vram_bandwidth_gbps = 3;
}

message StageEvent {
  string replica_id = 1;
  string job_id = 2;
  ReplicaState state = 3;
  string image_hash = 4;
  string model_hash = 5;
  string error_message = 6;
  google.protobuf.Timestamp ts = 7;
  // Human-readable progress, e.g. "pulling 1.2 GB / 4.7 GB".
  string detail = 8;
}

message UsageBatch {
  repeated UsageRecord records = 1;
}

message UsageRecord {
  string request_id = 1;  // Idempotency key
  string deployment_id = 2;
  string replica_id = 3;
  int32 input_tokens = 4;
  int32 output_tokens = 5;
  double gpu_seconds = 6;
  string tier = 7;
  google.protobuf.Timestamp ts = 8;
  RequestStatus status = 9;
}

message DrainAck {
  string reason = 1;
  int32 remaining_jobs = 2;
}

// A slice of an inference response flowing back to the coordinator. For a
// streamed request each chunk carries raw SSE bytes; for a non-streamed request
// a single chunk carries the whole JSON body. The final chunk has done=true and,
// when the runtime reported them, exact token counts.
message InferenceChunk {
  string request_id = 1;
  bytes data = 2;
  bool done = 3;
  int32 status_code = 4;
  string error = 5;
  int32 prompt_tokens = 6;
  int32 completion_tokens = 7;
}

// ─── Coordinator → Agent Messages ────────────────────────────

message CoordinatorMessage {
  oneof payload {
    RegisterResponse register_response = 1;
    ManifestDispatch manifest = 2;
    DrainRequest drain = 3;
    UpdateAvailable update = 4;
    InferenceRequest inference_request = 5;
    InferenceCancel inference_cancel = 6;
    StopReplica stop_replica = 7;
  }
}

message RegisterResponse {
  bool accepted = 1;
  string host_id = 2;
  string overlay_ip = 3;
  string wg_public_key = 4;
  string wg_endpoint = 5;
  string rejection_reason = 6;
  // Issued on first enrolment only. The agent must persist it and present it
  // on every reconnect; it is never sent again.
  string host_credential = 7;
  string tier = 8;
  string status = 9;
  // Ed25519 public key that signs every ManifestDispatch (SRS FR-53). The agent
  // pins it on first enrolment and refuses manifests that do not verify.
  bytes manifest_public_key = 10;

  // Every address this installation can be reached at, best first. The agent
  // remembers them and tries each when it reconnects, so the platform can move
  // to a new address without anyone touching the hosts. Empty when only one
  // address exists.
  repeated string coordinator_urls = 11;
}

message ManifestDispatch {
  string job_id = 1;
  string replica_id = 2;
  string deployment_id = 3;
  string model_id = 4;
  string image_url = 5;
  string image_hash = 6;
  string model_artifact_url = 7;
  string model_hash = 8;

  // Resource limits
  int32 cpu_cores = 9;
  int64 memory_mb = 10;
  int64 disk_mb = 11;
  string gpu_uuid = 12;

  // Network
  int32 inference_port = 13;
  repeated string egress_allowlist = 14;

  // Environment
  map<string, string> env_vars = 15;

  // Signature (Ed25519)
  bytes signature = 16;
  bytes signing_key_id = 17;

  // Identifier of the model inside the agent's runtime, e.g. "qwen2.5:7b" for
  // Ollama or "Qwen/Qwen2.5-7B-Instruct" for vLLM. Resolved by the coordinator
  // from the catalogue so hosts never guess.
  string runtime_model = 18;
  string model_name = 19;
  // Unix seconds; covered by the signature so a captured manifest cannot be
  // replayed indefinitely.
  int64 issued_at = 20;
}

message StopReplica {
  string replica_id = 1;
  string reason = 2;
}

// An OpenAI-compatible request to execute against a replica. The body is the
// customer's JSON with "model" already rewritten to the runtime identifier.
message InferenceRequest {
  string request_id = 1;
  string replica_id = 2;
  string path = 3;  // e.g. "/v1/chat/completions"
  bytes body = 4;
  bool stream = 5;
  int32 timeout_seconds = 6;
}

message InferenceCancel {
  string request_id = 1;
}

message DrainRequest {
  string reason = 1;
  int32 grace_period_seconds = 2;
}

message UpdateAvailable {
  string version = 1;
  string download_url = 2;
  string checksum = 3;
  bytes signature = 4;
  bool mandatory = 5;
}

// ─── Enums ───────────────────────────────────────────────────

enum ReplicaState {
  REPLICA_STATE_UNSPECIFIED = 0;
  REPLICA_STATE_PENDING = 1;
  REPLICA_STATE_PULLING = 2;
  REPLICA_STATE_LOADING = 3;
  REPLICA_STATE_WARMING = 4;
  REPLICA_STATE_SERVING = 5;
  REPLICA_STATE_DEGRADED = 6;
  REPLICA_STATE_STOPPING = 7;
  REPLICA_STATE_STOPPED = 8;
  REPLICA_STATE_FAILED = 9;
}

enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_SUCCESS = 1;
  REQUEST_STATUS_ERROR = 2;
  REQUEST_STATUS_TIMEOUT = 3;
  REQUEST_STATUS_CANCELLED = 4;
}
