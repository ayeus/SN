version: v2
modules:
  - path: proto
    name: buf.build/Ayeus/AyeusANN
lint:
  use:
    - STANDARD
  except:
    # The agent stream carries many message kinds in one oneof envelope; the
    # envelope names describe direction, not a single RPC.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
