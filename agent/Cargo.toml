[package]
name = "spazenode-agent"
version = "0.1.0"
edition = "2021"
authors = ["Spazor Private Limited"]
description = "SpazeNode host agent — GPU detection, benchmark, job execution, heartbeat"
license = "Proprietary"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
