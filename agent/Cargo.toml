[package]
name = "ayeusann-agent"
version = "0.3.0"
edition = "2021"
authors = ["Ayeus Private Limited"]
description = "AyeusANN host agent — GPU detection, benchmark, model runtime supervision, inference tunnel, heartbeat"
license = "Proprietary"

[[bin]]
name = "ayeusann-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
base64 = "0.22"
rand = "0.8"
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
sysinfo = "0.30"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
