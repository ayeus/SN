# AyeusANN development infrastructure.
# `make dev` starts Postgres and Redis, which is all the services use today.
# NATS and MinIO are in the architecture (event bus, model cache) but no code
# talks to them yet; start them with `--profile full` when that work lands.

services:
  # ─── Data Layer ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ann-postgres
    environment:
      POSTGRES_USER: ayeusann
      POSTGRES_PASSWORD: ayeusann_dev
      POSTGRES_DB: ayeusann
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayeusann"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ann-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    profiles: ["full"]
    image: nats:2-alpine
    container_name: ann-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    command: "--jetstream --store_dir /data"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm=0"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    profiles: ["full"]
    image: minio/minio:latest
    container_name: ann-minio
    environment:
      MINIO_ROOT_USER: ayeusann
      MINIO_ROOT_PASSWORD: ayeusann_dev
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
