name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'
  RUST_VERSION: 'stable'

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.6

  lint-proto:
    name: Lint (Protobuf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint

  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cd agent && cargo clippy -- -D warnings
      - run: cd agent && cargo fmt -- --check

  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ayeusann
          POSTGRES_PASSWORD: ayeusann_dev
          POSTGRES_DB: ayeusann
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayeusann"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install migrate CLI
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
      - name: Run DB Migrations & Seed
        run: |
          migrate -path schema/migrations -database "postgres://ayeusann:ayeusann_dev@localhost:5432/ayeusann?sslmode=disable" up
          docker exec $(docker ps -q -f name=postgres) psql -U ayeusann -d ayeusann -f schema/seeds/001_catalog.sql || true
      - name: Run Go Tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://ayeusann:ayeusann_dev@localhost:5432/ayeusann?sslmode=disable
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd agent && cargo test

  build-go:
    name: Build (Go)
    runs-on: ubuntu-latest
    needs: [lint-go, test-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build-go

  build-agent:
    name: Build (Agent)
    runs-on: ubuntu-latest
    needs: [lint-rust, test-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd agent && cargo build --release
