name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (vet, test with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ayeusann
          POSTGRES_PASSWORD: ayeusann_dev
          POSTGRES_DB: ayeusann_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ayeusann" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://ayeusann:ayeusann_dev@localhost:5433/ayeusann_test?sslmode=disable
      SN_REQUIRE_DB: "1"   # integration tests fail instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - name: Migrate and seed
        run: |
          migrate -path schema/migrations -database "$TEST_DATABASE_URL" up
          for f in schema/seeds/*.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Migrations roll back cleanly
        run: |
          migrate -path schema/migrations -database "$TEST_DATABASE_URL" down 1
          migrate -path schema/migrations -database "$TEST_DATABASE_URL" up
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: make build-go

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the previous commit is the baseline below
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      # Agents already installed on other people's machines speak the protocol
      # as it was; a change must not break them.
      - name: No breaking protocol changes
        run: buf breaking --against ".git#ref=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"

  agent:
    name: Rust agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cd agent && cargo fmt -- --check
      - run: cd agent && cargo clippy --all-targets -- -D warnings
      - run: cd agent && cargo test
      - run: cd agent && cargo build --release
      # The Windows agent is cross-compiled; keep it building and warning-free.
      - name: Windows target
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cd agent && cargo clippy --target x86_64-pc-windows-gnu -- -D warnings

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The whole loop with no GPU: a stand-in runtime replaces Ollama and the
  # agents report a simulated card. Everything between them is the real code.
  e2e:
    name: End to end (no GPU)
    # 22.04 keeps the agent's glibc old enough to run in the Debian container
    # that plays the second machine.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler uuid-runtime
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
          python3 -m pip install --user openai
      - name: Start the platform
        run: |
          scripts/dev.sh db
          scripts/dev.sh services
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/v1/network/stats >/dev/null && exit 0
            sleep 1
          done
          echo "the gateway did not come up" >&2
          exit 1
      - name: Publish the agent for the installer
        run: make dist-agent
      - name: Smoke tests
        run: make smoke-fake
        env:
          REQUIRE_SDK: "1"
      # One version enrols, the next is published, and the host must be
      # running it within a minute; bad releases must be refused.
      - name: Self-update
        run: make update-check
      - name: Keep the logs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs/

  private:
    name: Private installation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler uuid-runtime
          python3 -m pip install --user openai
      - name: Publish the agent for the installer
        run: make dist-agent
      # A throwaway installation with generated secrets: started, smoke-tested
      # with no GPU, backed up, restored and checked for open ports.
      - name: Start, test, back up and restore
        run: make private-check
        env:
          REQUIRE_SDK: "1"
      - name: Keep the logs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-logs
          path: logs/

  images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/services.Dockerfile -t ayeusann/services .
      - run: docker build -t ayeusann/console web/console
      - name: Compose file is valid
        run: docker compose -f deploy/compose/docker-compose.prod.yml --env-file deploy/compose/.env.prod.example config -q
        env:
          JWT_SECRET: ci
          INTERNAL_SERVICE_SECRET: ci
          POSTGRES_PASSWORD: ci
          MANIFEST_SIGNING_KEY: ci
          OWNER_CODE: ci

