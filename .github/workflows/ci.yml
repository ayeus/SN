name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (vet, test with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ayeusann
          POSTGRES_PASSWORD: ayeusann_dev
          POSTGRES_DB: ayeusann_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ayeusann" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://ayeusann:ayeusann_dev@localhost:5433/ayeusann_test?sslmode=disable
      SN_REQUIRE_DB: "1"   # integration tests fail instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/
      - name: Migrate and seed
        run: |
          migrate -path schema/migrations -database "$TEST_DATABASE_URL" up
          for f in schema/seeds/*.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Migrations roll back cleanly
        run: |
          migrate -path schema/migrations -database "$TEST_DATABASE_URL" down 1
          migrate -path schema/migrations -database "$TEST_DATABASE_URL" up
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: make build-go

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint

  agent:
    name: Rust agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cd agent && cargo fmt -- --check
      - run: cd agent && cargo clippy --all-targets -- -D warnings
      - run: cd agent && cargo test
      - run: cd agent && cargo build --release

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
