name: Release

# Tagging vX.Y.Z builds the host agent for each platform and attaches the
# binaries to a GitHub release, named as the installer expects them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent:
    name: Agent ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor at 2.35.
          - { name: linux-amd64,   runner: ubuntu-22.04 }
          - { name: linux-arm64,   runner: ubuntu-22.04-arm }
          - { name: darwin-arm64,  runner: macos-14 }
          # Cross-compiled with MinGW, the same way `make dist-agent-windows` does.
          - { name: windows-amd64, runner: ubuntu-22.04, target: x86_64-pc-windows-gnu, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Build
        if: ${{ !matrix.target }}
        run: |
          cd agent && cargo build --release --locked
          cp target/release/ayeusann-agent ../ayeusann-agent-${{ matrix.name }}
      - name: Build (cross)
        if: ${{ matrix.target }}
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add ${{ matrix.target }}
          cd agent && cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ayeusann-agent${{ matrix.ext }} ../ayeusann-agent-${{ matrix.name }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ayeusann-agent-${{ matrix.name }}
          path: ayeusann-agent-${{ matrix.name }}${{ matrix.ext }}

  publish:
    name: Publish release
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum ayeusann-agent-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ayeusann-agent-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
